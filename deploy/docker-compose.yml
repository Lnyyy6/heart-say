name: heart-say

# 默认完整栈：web + api + qdrant + redis + nginx（offline 生成器，无需 GPU）。
# 接入真实 Qwen：
#   1. 设置 LLM_BACKEND=openai_compatible，指向 vLLM 容器或外部模型服务。
#   2. 启动 GPU profile：docker compose --profile gpu up -d。
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      LLM_BACKEND: ${LLM_BACKEND:-offline}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://api-model:8000/v1}
      LLM_API_KEY: ${LLM_API_KEY:-EMPTY}
      LLM_MODEL: ${LLM_MODEL:-heart-say-qwen}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-hash}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000,http://localhost:8080
    volumes:
      - session-data:/srv/heart-say/data/sessions
      - ../reports:/srv/heart-say/reports:ro
    depends_on:
      - redis
      - qdrant
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8010/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    environment:
      NEXT_PUBLIC_API_BASE: /api
    depends_on:
      - api

  nginx:
    image: nginx:stable-alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

  qdrant:
    image: qdrant/qdrant:v1.12.5
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-6333}:6333"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    volumes:
      - redis-data:/data

  # 可选：GPU 节点上的 vLLM 模型服务
  api-model:
    image: vllm/vllm-openai:latest
    profiles: ["gpu"]
    runtime: nvidia
    environment:
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
    command: >
      --model /models/qwen7b-awq
      --quantization awq
      --served-model-name heart-say-qwen
      --max-model-len 8192
      --gpu-memory-utilization 0.9
    volumes:
      - ${AWQ_MODEL_PATH:-./outputs/qwen7b-awq}:/models/qwen7b-awq:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  qdrant-data:
  session-data:
  redis-data: