[project]
name = "heart-say"
version = "0.1.0"
description = "心语 · 心理教育情绪陪伴助手：RAG + SFT/DPO + Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "qdrant-client>=1.12,<1.13",
  "numpy>=1.26",
  "rank-bm25>=0.2.2",
  "jieba>=0.42.1",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "langgraph>=0.2.50",
  "redis>=5.0",
  "sse-starlette>=2.1",
]

[project.optional-dependencies]
# 仅本地/GPU 推理时需要，默认安装不拉取 torch
embeddings = ["sentence-transformers>=3.0", "FlagEmbedding>=1.3"]
train = [
  "torch>=2.3",
  "transformers>=4.46",
  "peft>=0.13",
  "trl>=0.12",
  "datasets>=3.0",
  "accelerate>=1.0",
  "bitsandbytes>=0.44",
  "sentencepiece>=0.2",
]
serve = ["vllm>=0.6.3"]
quant = ["autoawq>=0.2.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: 依赖模型下载或 GPU 的测试"]
