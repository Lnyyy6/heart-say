# 3B 降级链路的 DPO 配置；必须与 sft-qwen3b 配对。
base_model: Qwen/Qwen2.5-3B-Instruct
sft_adapter: outputs/sft-qwen3b
dataset_path: data/preference/train_pairs.jsonl
output_dir: outputs/dpo-qwen3b
seed: 42

training:
  beta: 0.1
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-5
  max_length: 1536
  max_prompt_length: 768
  logging_steps: 10
  save_steps: 100
  save_total_limit: 2
  warmup_ratio: 0.05
  bf16: true
  optim: paged_adamw_8bit
