# 显存不足时的降级配置：3B QLoRA。数据与评测口径不变。
model_name_or_path: Qwen/Qwen2.5-3B-Instruct
dataset_paths:
  - data/sft/train.jsonl
output_dir: outputs/sft-qwen3b
seed: 42

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  num_train_epochs: 2
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  max_seq_length: 2048
  logging_steps: 10
  save_steps: 100
  save_total_limit: 2
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  bf16: true
  gradient_checkpointing: true
  optim: paged_adamw_8bit
